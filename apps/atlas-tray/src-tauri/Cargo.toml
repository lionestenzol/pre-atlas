[package]
name = "atlas-tray"
version = "0.1.0"
description = "Atlas — always-on tray door to the mission-control UI"
authors = ["Bruke"]
edition = "2021"
rust-version = "1.77"

# Binary named AtlasTray to sidestep a Windows filesystem collision with the
# Node-SEA `atlas.exe` CLI (Windows lookups are case-insensitive, so Atlas.exe
# and atlas.exe in the same dir overwrite each other on copy). The window
# title / product display name stays "Atlas" via tauri.conf.json productName.
# See fest atlas-doors-AD0001/003_TRUST TODO for the collision incident.
[[bin]]
name = "AtlasTray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
