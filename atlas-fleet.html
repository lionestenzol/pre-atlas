<meta charset="utf-8">
<title>Atlas Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0b0d10; --card:#141821; --border:#232833; --text:#e6e8ec;
    --dim:#8a92a3; --green:#3ac97a; --amber:#e0a52a; --red:#e05a5a; --link:#7aa2ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#ffffff; --border:#dfe3ea; --text:#111318; --dim:#5b6472; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 20px 28px 12px;
    border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  #tally { font-size: 13px; color: var(--dim); }
  #stamp { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  main { padding: 20px 28px 40px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px;
    align-items: baseline; }
  .name { font-weight: 600; font-size: 14px; grid-column: 1 / 2; }
  .port { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; grid-column: 2 / 3; }
  .actions { grid-column: 3 / 4; grid-row: 1 / 3; align-self: center; }
  .meta { grid-column: 1 / 3; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
    display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: baseline; background: var(--dim); }
  .st-live .dot { background: var(--green); box-shadow: 0 0 0 3px color-mix(in oklab, var(--green) 25%, transparent); }
  .st-warn .dot { background: var(--amber); }
  .st-down .dot { background: var(--red); }
  .st-live { border-color: color-mix(in oklab, var(--green) 40%, var(--border)); }
  .st-warn { border-color: color-mix(in oklab, var(--amber) 40%, var(--border)); }
  .st-down { border-color: color-mix(in oklab, var(--red)   40%, var(--border)); }
  button { background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--link); color: var(--link); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status-text { text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; font-weight: 600; }
  .st-live .status-text { color: var(--green); }
  .st-warn .status-text { color: var(--amber); }
  .st-down .status-text { color: var(--red);   }
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; max-width: 380px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #err { padding: 12px 28px; color: var(--red); font-size: 13px; display: none; }
  #err.show { display: block; }
  .token-row { padding: 12px 28px 0; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--dim); }
  .token-row input { flex: 1; max-width: 480px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
</style>

<header>
  <h1>Atlas Fleet</h1>
  <span id="tally">loading…</span>
  <span id="stamp"></span>
</header>
<div class="token-row">
  <label for="tok">write token:</label>
  <input id="tok" type="password" placeholder="paste .atlas-write-token contents to enable restart" autocomplete="off">
  <span id="tok-hint" style="font-size:11px;color:var(--dim)">Restart needs the token. Read-only without it.</span>
</div>
<div id="err"></div>
<main id="grid"></main>
<div id="toast"></div>

<script>
const API = "http://127.0.0.1:3080";
const grid = document.getElementById("grid");
const tally = document.getElementById("tally");
const stamp = document.getElementById("stamp");
const err = document.getElementById("err");
const toastEl = document.getElementById("toast");
const tokInput = document.getElementById("tok");

tokInput.value = localStorage.getItem("atlas-write-token") || "";
tokInput.addEventListener("change", () => {
  localStorage.setItem("atlas-write-token", tokInput.value.trim());
});

function toast(msg, ms = 3500) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), ms);
}

function fmtUptime(ms) {
  if (!ms || ms < 0) return "—";
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h";
  return Math.floor(h / 24) + "d";
}

function classify(s) {
  if (s.status === "online" && s.alive) return "st-live";
  if (s.status === "online" && !s.alive) return "st-warn";
  return "st-down";
}
function statusLabel(s) {
  if (s.status === "online" && s.alive) return "live";
  if (s.status === "online" && !s.alive) return "flapping";
  return s.status;
}

async function restart(name) {
  const token = tokInput.value.trim();
  if (!token) { toast("paste the write token first"); return; }
  const btn = document.querySelector(`button[data-name="${name}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "restarting…"; }
  try {
    const r = await fetch(`${API}/api/fleet/restart/${encodeURIComponent(name)}`, {
      method: "POST",
      headers: { "X-Atlas-Token": token },
    });
    const j = await r.json();
    if (r.ok && j.ok) toast(`restarted ${name}`);
    else toast(`restart failed: ${j.error || j.err || r.status}`);
  } catch (e) {
    toast(`restart error: ${e.message}`);
  } finally {
    setTimeout(refresh, 800);
  }
}
window.__restart = restart;

function render(snap) {
  err.classList.remove("show");
  const { services, total, online, generated_at } = snap;
  tally.textContent = `${online} / ${total} live`;
  stamp.textContent = new Date(generated_at).toLocaleTimeString();
  grid.innerHTML = services.map((s) => `
    <div class="card ${classify(s)}">
      <div class="name">${s.name}</div>
      <div class="port">:${s.port || "—"}</div>
      <div class="actions"><button data-name="${s.name}" onclick="__restart('${s.name}')">restart</button></div>
      <div class="meta">
        <span><span class="dot"></span><span class="status-text">${statusLabel(s)}</span></span>
        <span>up ${fmtUptime(s.uptime_ms)}</span>
        <span>${s.mem_mb} MB</span>
        <span>${s.cpu}% cpu</span>
        <span>↺ ${s.restarts}${s.unstable_restarts ? ` (${s.unstable_restarts} unstable)` : ""}</span>
      </div>
    </div>
  `).join("");
}

async function refresh() {
  try {
    const r = await fetch(`${API}/api/fleet`, { cache: "no-store" });
    if (!r.ok) throw new Error(`fleet-api returned ${r.status}`);
    render(await r.json());
  } catch (e) {
    err.textContent = `fleet-api unreachable at ${API} — is the fleet-api service up? (${e.message})`;
    err.classList.add("show");
    tally.textContent = "—";
  }
}

refresh();
setInterval(refresh, 3000);
</script>
