[project]
name = "fest-py"
version = "0.1.0"
description = "Python wrapper + MCP server for the fest CLI"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "mcp>=1.0",
]

[project.scripts]
fest-py = "fest_py.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fest_py*", "mcp_server*"]
